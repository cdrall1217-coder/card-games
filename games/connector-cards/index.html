<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7f7f2">
  <title>이어 주는 말 카드 뒤집기</title>
  <link rel="stylesheet" href="../../common/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-connector-cards">
  <div id="app" class="app" data-phase="ready">
    <header class="topbar">
      <h1>이어 주는 말 카드 뒤집기</h1>
      <div class="stats">
        <p class="stat">맞힌 개수 <strong id="score-label">0/21</strong></p>
        <p class="stat">시도 횟수 <strong id="attempt-label">0</strong></p>
      </div>
      <button type="button" class="btn btn-primary" id="new-game">새 게임</button>
    </header>

    <div class="board">
      <section class="deck deck-sentences">
        <h2 class="deck-title">문장 카드</h2>
        <div id="sentence-grid" class="grid"></div>
      </section>

      <section class="stage" aria-label="문장과 이어 주는 말">
        <p id="placeholder" class="placeholder">왼쪽 문장 카드를 뒤집으면<br>문장이 여기에 나타나요.</p>
        <div id="sentence-box" class="sentence-box" hidden>
          <p id="line-before" class="line"></p>
          <p class="blank-row"><span id="blank">(       )</span></p>
          <p id="line-after" class="line"></p>
        </div>
        <div class="choices" role="group" aria-label="이어 주는 말 고르기">
          <button type="button" class="choice" data-answer="그리고" disabled>그리고</button>
          <button type="button" class="choice" data-answer="그래서" disabled>그래서</button>
          <button type="button" class="choice" data-answer="그러나" disabled>그러나</button>
        </div>
        <p class="rule">고른 말과 뒤집은 카드가 모두 문장에 맞아야 해요.</p>
        <p id="feedback" class="feedback" role="status" aria-live="polite">왼쪽에서 문장 카드 한 장을 뒤집어요.</p>
      </section>

      <section class="deck deck-words">
        <h2 class="deck-title">이어 주는 말 카드</h2>
        <div id="word-grid" class="grid"></div>
      </section>
    </div>
  </div>

  <div id="complete" class="complete" hidden>
    <div class="complete-card" role="dialog" aria-modal="true" aria-labelledby="complete-title">
      <p class="complete-kicker">참 잘했어요!</p>
      <h2 id="complete-title">모든 문장을 맞혔어요</h2>
      <p id="complete-score" class="complete-score">21/21개 성공</p>
      <p class="complete-tries">총 시도 횟수 <strong id="complete-attempts">0</strong>회</p>
      <button type="button" class="btn btn-primary" id="replay">다시 하기</button>
    </div>
  </div>

  <noscript>
    <p class="error">이 게임은 자바스크립트가 필요합니다.</p>
  </noscript>
  <script src="../../common/common.js"></script>
  <script src="game.js"></script>
</body>
</html>
